<!doctype html>
<html
  lang="en"
  dir="auto"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <title>{{ subject }}</title>
    <!--[if !mso]><!-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--<![endif]-->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style type="text/css">
      #outlook a { padding: 0; }
      body {
        margin: 0;
        padding: 0;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table, td {
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
      }
      p { display: block; margin: 13px 0; }
    </style>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:AllowPNG />
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
    <!--[if lte mso 11]>
      <style type="text/css">
        .mj-outlook-group-fix { width: 100% !important; }
      </style>
    <![endif]-->
    <style type="text/css">
      @media only screen and (min-width: 480px) {
        .mj-column-per-100 { width: 100% !important; max-width: 100%; }
      }
    </style>
    <style media="screen and (min-width:480px)">
      .moz-text-html .mj-column-per-100 { width: 100% !important; max-width: 100%; }
    </style>
    <style type="text/css">
      @media only screen and (max-width: 479px) {
        table.mj-full-width-mobile { width: 100% !important; }
        td.mj-full-width-mobile { width: auto !important; }
      }
    </style>
    <style type="text/css">
      a, span, td, th {
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
      }
    </style>
  </head>

  <body style="word-spacing: normal; background-color: #f4f6f9">

    <!-- Preview text (hidden) -->
    <div style="display:none;font-size:1px;color:#ffffff;line-height:1px;max-height:0px;max-width:0px;opacity:0;overflow:hidden;">
      {{ subject }}
    </div>

    <div style="background-color: #f4f6f9" role="article" aria-roledescription="email" lang="en">

      <!--[if mso | IE]><table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;" width="600"><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->

      <!-- HEADER: Company name branding -->
      <div style="margin: 0px auto; max-width: 600px;">
        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%">
          <tbody>
            <tr>
              <td style="direction:ltr;font-size:0px;padding:24px 0 16px;text-align:center;">
                <div style="
                  font-family: 'Times New Roman', Times, serif;
                  font-size: 22px;
                  font-weight: 700;
                  color: {{ primary_color }};
                  letter-spacing: 0.5px;
                ">
                  {{ company_name }}
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!--[if mso | IE]></td></tr></table><table align="center" border="0" cellpadding="0" cellspacing="0" class="" role="presentation" style="width:600px;" width="600" bgcolor="#ffffff"><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->

      <!-- MAIN CONTENT CARD -->
      <div style="background:#ffffff;background-color:#ffffff;margin:0px auto;max-width:600px;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;background-color:#ffffff;width:100%;">
          <tbody>
            <tr>
              <td style="direction:ltr;font-size:0px;padding:32px 0 24px;text-align:center;">

                <!--[if mso | IE]><table role="presentation" border="0" cellpadding="0" cellspacing="0"><tr><td style="vertical-align:top;width:600px;"><![endif]-->
                <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%;">
                  <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top;" width="100%">
                    <tbody>

                      <!-- Body content -->
                      <tr>
                        <td align="left" style="font-size:0px;padding:10px 32px;word-break:break-word;">
                          <div style="
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 15px;
                            font-weight: 400;
                            line-height: 24px;
                            text-align: left;
                            color: #333333;
                          ">
                            {{ content|safe }}
                          </div>
                        </td>
                      </tr>

                      <!-- CTA Button (optional) -->
                      {% if button_link %}
                      <tr>
                        <td align="left" style="font-size:0px;padding:16px 32px 8px;word-break:break-word;">
                          <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:separate;line-height:100%;">
                            <tbody>
                              <tr>
                                <td align="center" bgcolor="{{ primary_color }}" role="presentation" style="border:none;border-radius:4px;cursor:auto;mso-padding-alt:12px 24px;background:{{ primary_color }};" valign="middle">
                                  <a href="{{ button_link }}" style="
                                    display: inline-block;
                                    background: {{ primary_color }};
                                    color: #ffffff;
                                    font-family: 'Times New Roman', Times, serif;
                                    font-size: 14px;
                                    font-weight: 600;
                                    line-height: 30px;
                                    margin: 0;
                                    text-decoration: none;
                                    padding: 12px 28px;
                                    border-radius: 4px;
                                  " target="_blank">
                                    {{ button_text }}
                                  </a>
                                </td>
                              </tr>
                            </tbody>
                          </table>
                        </td>
                      </tr>
                      {% endif %}

                      <!-- Divider -->
                      <tr>
                        <td align="center" style="font-size:0px;padding:24px 32px 8px;word-break:break-word;">
                          <p style="border-top:solid 1px #eeeeee;font-size:1px;margin:0px auto;width:100%;"></p>
                        </td>
                      </tr>

                      <!-- Sign-off -->
                      <tr>
                        <td align="left" style="font-size:0px;padding:8px 32px 24px;word-break:break-word;">
                          <div style="
                            font-family: 'Times New Roman', Times, serif;
                            font-size: 13px;
                            font-weight: 400;
                            line-height: 20px;
                            text-align: left;
                            color: #888888;
                          ">
                            This is an automated message from {{ company_name }}. Please do not reply to this email.
                          </div>
                        </td>
                      </tr>

                    </tbody>
                  </table>
                </div>
                <!--[if mso | IE]></td></tr></table><![endif]-->

              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!--[if mso | IE]></td></tr></table><table align="center" border="0" cellpadding="0" cellspacing="0" class="" role="presentation" style="width:600px;" width="600"><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->

      <!-- FOOTER -->
      <div style="margin:0px auto;max-width:600px;">
        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;">
          <tbody>
            <tr>
              <td style="direction:ltr;font-size:0px;padding:20px 0 32px;text-align:center;">
                <div class="mj-column-per-100 mj-outlook-group-fix" style="font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:100%;">
                  <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="vertical-align:top;" width="100%">
                    <tbody>
                      <tr>
                        <td align="center" style="font-size:0px;padding:8px 25px;word-break:break-word;">
                          <div style="font-family:Muli,Arial,sans-serif;font-size:12px;font-weight:400;line-height:18px;text-align:center;color:#999999;">
                            &copy; {{ year }} {{ company_name }}
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <td align="center" style="font-size:0px;padding:4px 25px;word-break:break-word;">
                          <div style="font-family:Muli,Arial,sans-serif;font-size:12px;font-weight:400;line-height:18px;text-align:center;color:#999999;">
                            {{ company_address }}
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!--[if mso | IE]></td></tr></table><![endif]-->

    </div>
  </body>
</html>
