version: '3.9'

services:

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  web:
    image: athulkefitech1123/kau-fpo-backend:latest
    build: .
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery:
    image: athulkefitech1123/kau-fpo-backend:latest
    build: .
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    image: athulkefitech1123/kau-fpo-backend:latest
    build: .
    restart: always
    command: celery -A config beat --loglevel=info
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_files:
  static_files:
  logs:
