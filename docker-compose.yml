version: '3.9'

services:

  db:
    image: postgis/postgis:17-3.5
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery:
    build: .
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    restart: always
    command: celery -A config beat --loglevel=info
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    image: athulkefitech1123/kau-fpo-frontend:testing
    restart: always
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/testing.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  media_files:
  static_files:
  logs:
