version: '3.9'

services:

  db:
    image: postgis/postgis:17-3.5
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  ml-service:
    image: athulkefitech1123/kau-fpo-ml-service:testing
    restart: always
    # Mock crop recommendation FastAPI service (Aravind — P2-06).
    # Django (web) proxies /api/recommendations/ requests to this on port 8001.
    volumes:
      - ml_models:/ml_models
    depends_on:
      - redis

  chatbot-service:
    image: athulkefitech1123/kau-fpo-chatbot-service:testing
    restart: always
    # Extractive-QA FastAPI service (chatbot — Phase 1).
    # Django (apps.chatbot) proxies /api/chatbot/message/ retrieval hits here
    # on port 8002. Kept separate from ml-service so QA workload doesn't
    # contend for crop-recommendation model loads.
    volumes:
      - hf_cache:/hf_cache

  web:
    image: athulkefitech1123/kau-fpo-backend:testing
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - logs:/app/logs
      # Shared with celery + ml-service so retrain uploads (CSV + resulting
      # .joblib) are visible across all three containers.
      - ml_models:/ml_models
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - ml-service
      - chatbot-service

  celery:
    image: athulkefitech1123/kau-fpo-backend:testing
    restart: always
    # Kept at concurrency=1: the 2 GB test box is already at ~93% RAM with
    # all containers running (postgres + redis + 4 python apps + chatbot's
    # torch model + nginx + frontend). Bumping to 3 during UAT tipped the
    # server over into memory-thrash (load avg > 17) and killed SSH access.
    # Post-UAT: either scale up the test server to >= 4 GB, or split heavy
    # tasks (retrain, DPR) onto their own dedicated worker container.
    command: celery -A config worker --loglevel=info --concurrency=1
    volumes:
      - logs:/app/logs
      - ml_models:/ml_models
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    image: athulkefitech1123/kau-fpo-backend:testing
    restart: always
    command: celery -A config beat --loglevel=info
    volumes:
      - logs:/app/logs
      - ml_models:/ml_models
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    image: athulkefitech1123/kau-fpo-frontend:testing
    restart: always
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/testing.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  media_files:
  static_files:
  logs:
  ml_models:
  hf_cache:      # tinyroberta model cache for chatbot-service
